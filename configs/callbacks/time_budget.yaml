# Graceful wall-clock stop: training ends, then the best checkpoint is still tested.
# Inactive unless budget_seconds is set or the search launcher exports OMICSGBENCH_DEADLINE
# (omicsgbench.utils.hparam_search.DEADLINE_ENV_VAR).

time_budget:
  _target_: omicsgbench.callbacks.time_budget.TimeBudget
  budget_seconds: null
  deadline: ${oc.env:OMICSGBENCH_DEADLINE,null}
